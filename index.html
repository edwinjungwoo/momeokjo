<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>모먹죠 - 점심 고?</title>
    <meta name="description" content="인원과 거리만 고르면 근처 식당을 바로 골라드려요" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="모먹죠" />
    <meta property="og:title" content="모먹죠 - 점심 고?" />
    <meta property="og:description" content="인원과 거리만 고르면 근처 식당을 바로 골라드려요" />
    <meta property="og:image" content="https://mmj.itmz.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FF683D" />
    <meta name="color-scheme" content="only light" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- R45: 첫 화면에 꼭 필요한 다른 호스트는 미리 연결한다 (글꼴 CSS·글꼴, 지도 SDK 로더, 지도 본체·이미지) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://dapi.kakao.com" />
    <link rel="preconnect" href="https://t1.daumcdn.net" />
    <link rel="dns-prefetch" href="https://img1.kakaocdn.net" />
    <!-- 지도 SDK 로더(1.4KB)를 앱 JS와 나란히 받는다. 주소는 web/kakaoLoader.ts가 붙이는 script와 똑같아야 재사용된다 -->
    <link rel="preload" as="script" href="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_JS_KEY%&autoload=false" />
    <!-- 글꼴 CSS는 첫 화면을 막지 않게 받는다 (글꼴이 오기 전에는 시스템 글꼴, font-display: swap). Lighthouse 모바일 FCP 1.95→1.5초 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
